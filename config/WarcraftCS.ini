; Native unit attack multiplier 0..10, default 1. Armor/passives/allied damage remain native/configured.
DamageMultiplier=1
; Native walk/idle and hit/ready leap poses; stock Arthas has no authored Jump sequence. F8 applies live.
MovementAnimations=true
; Match each model's authored Warcraft walk/run speeds; false uses RunCycleDistance. F8 applies live.
AutoAnimationSpeed=true
; Visual locomotion playback multiplier, 0.1..3. Does not modify movement or attack speed.
AnimationSpeedMultiplier=1
; World distance travelled per complete Walk cycle, Warcraft units 40..1000.
RunCycleDistance=210
; Takeoff/landing pose windows in seconds (.02..0.3 and 0..0.5). Airborne body follows physical jump height.
TakeoffDuration=0.10
LandingDuration=0.16

