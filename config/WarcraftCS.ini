; Existing team keys remain editable; F8 reloads edits. Green allies include your other units.
ShowAllyHealthBars=false
ShowEnemyHealthBars=false
; Warcraft units, 0..15000 (default 2000). 0 hides bars; fog-hidden units stay hidden.
HealthBarDistance=2000
; Native Warcraft minimap in the FPS top-right corner, true | false (default true).
; M toggles during the session; startup/F8 restores this saved preference.
ShowMinimap=true
; Square minimap side as a percentage of window height, 10..40 (default 22). F8 applies live.
MinimapSizePercent=22
; Four spell icons at the bottom-right, true | false (default true). F8 reloads all spell HUD settings.
ShowSpellIcons=true
; Display native remaining cooldown seconds, true | false (default true).
ShowSpellCooldowns=true
; Icon side as a percentage of window height, 4..14 (default 7); fitted to narrow windows.
SpellIconSizePercent=7
; Horizontal speed counter, true | false (default false). Speed (P) toggles it during this session.
; CS/GoldSrc units per second, matching MaxBunnySpeed. Startup/F8 restores this saved preference.
ShowSpeed=false
; Disable explored fog AND unexplored black mask in offline FPS, true | false (default false).
; Fog (N) toggles during the session; startup/F8 loads this value. RTS/menus restore the map's switches.
DisableFogOfWar=false
; Native world labels must be in front of the FPS camera and within this distance.
; Warcraft units, 0..5000; 0 hides world labels in FPS. RTS and screen-space text stay unchanged.
