; Save changes and press F8 in FPS to reload this file. Restarting also loads it.
; Percentages are from each weapon's maximum magazine and reserve capacities.
; Rune rewards apply only to owned weapons; C4 percentage uses MaxBombs as capacity.
[Audio]
; CS-only volume, 0..100 percent. 100 retains previous levels; 0 mutes shots, steps, reloads and C4.
; Applied at startup and immediately on F8 in FPS, including sounds already playing. Warcraft audio is unchanged.
CSVolumePercent=100

[Rendering]
; Client frame cap, 30..360 FPS (default 144). 0 restores the original Warcraft limiter (~64 FPS).
; Applies at startup/on F8; actual FPS depends on hardware, map load and driver overrides.
MaxFPS=144
; FPS world-camera far clip, Warcraft units (3000..20000, default 15000; legacy 5000).
; Applies immediately on F8. Map visibility and atmospheric fog may hide distant objects.
DrawDistance=15000

[Logging]
; Detailed control/render traces; essential events and errors always remain recorded. true | false.
Detailed=true
; Render/movement summary interval in milliseconds, 100..60000. No per-frame disk writes.
IntervalMs=1000
; Current runtime log limit in MiB, 1..64; previous sessions/segments are retained as numbered .log files.
MaxFileMB=8
; Previous session/segment count, 0..8. All these settings apply at startup and on F8.
ArchiveCount=3

[Movement]
; Scale CS weapon movement speeds by native movement speed / reference; true | false (default false).
; false retains the existing slow/haste modifier. Roots, haste and slows remain native in both modes.
ScaleFromUnitMoveSpeed=false
; Baseline Warcraft units/s (1..1000, default 300). Applied immediately on F8.
UnitMoveSpeedReference=300
; Applies immediately on F8 in FPS; preserves current position and vertical velocity.
; Keep momentum through takeoff. Gain speed with A + left mouse turn / D + right mouse turn in the air.
BunnyHop=true
; Hold Space for another jump on landing; false requires releasing Space between jumps.
AutoJump=true
; Optional extra horizontal speed per moving jump, percent (0..100). 0 uses strafe gain only.
; Shift/Ctrl suppress this optional boost. Older custom values are preserved during updates.
JumpBoostPercent=0
; Horizontal cap during bunnyhop/air strafing, GoldSrc units/s (250..2000), world scale 1.5.
MaxBunnySpeed=1000
; Air wish-direction acceleration multiplier (0..100); strafing preserves sideways momentum.
AirAcceleration=10
; Initial upward speed, GoldSrc units/s (1..800). Default jump rises about 67.5 Warcraft units.
JumpSpeed=268.328
; Downward acceleration, GoldSrc units/s squared (100..3000).
Gravity=800
; Largest automatic ground step, Warcraft units (0..64). Larger drops fall under gravity.
StepHeight=27

[Loadout]
; melee = USP, knife and sword (default). all = every weapon with its starting ammo.
; Applied once on map load; F6 and F8 never grant another kit.
Mode=melee
; Starting C4 charges, 0..1000 (default 0). A positive count adds C4 to the starting kit.
; Applied on the next map; F8 does not remove purchased bombs or grant a new kit.
BombCount=0
; Starting/free-refill/rune bomb amount, 0..1000. Also caps purchases when unlimited is false.
MaxBombs=100
; true (default) allows repeat C4 purchases beyond MaxBombs; each charge still costs gold.
; false caps paid purchases at MaxBombs. Applies immediately on F8; never discards purchased bombs.
UnlimitedBombPurchases=true

[Buy]
; anywhere | friendly (allied buildings OR shops) | shops (shops only).
; Rechecked for B, menu purchases and quick ammo; the world keeps running while buying.
Access=anywhere
; Maximum center distance in Warcraft world units (0..3000).
Radius=600
; Optional custom shop unit rawcodes, separated by commas/spaces, e.g. nmer,ngme.
; Friendly or neutral-passive units with shop purchase/sell/neutral-interaction abilities qualify.
ShopTypes=
; F7 refills carried weapons and grants C4 for free; F9 freely grants all weapons and ammunition.

