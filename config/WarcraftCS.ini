AttackRange=150
AttackArc=50
; Horizontal blade sweep height above the actor's feet, Warcraft units 0..200.
AttackHeight=64
; Arthas prototype timing in seconds (interval .2..5, contact 0..3 and <= interval).
; Both scale with the hero's live attack-speed multiplier; F8 affects the next swing.
AttackInterval=2.2
