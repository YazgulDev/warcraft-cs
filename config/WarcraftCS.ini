; Save changes and press F8 in FPS to reload this file. Restarting also loads it.
; Percentages are from each weapon's maximum magazine and reserve capacities.
; Rune rewards apply only to owned weapons; C4 percentage uses MaxBombs as capacity.
[Audio]
; CS-only volume, 0..100 percent. 100 retains previous levels; 0 mutes shots, steps, reloads and C4.
; Applied at startup and immediately on F8 in FPS, including sounds already playing. Warcraft audio is unchanged.
CSVolumePercent=100

[Movement]
; Applies immediately on F8 in FPS; preserves current position and vertical velocity.
; Moving jumps skip friction and gain speed. Shift/Ctrl suppress the takeoff boost.
BunnyHop=true
; Hold Space for another jump on landing; false requires releasing Space between jumps.
AutoJump=true
; Extra horizontal speed per moving jump, percent (0..100).
JumpBoostPercent=8
; Horizontal cap during bunnyhop/air strafing, GoldSrc units/s (250..2000), world scale 1.5.
MaxBunnySpeed=1000
; Air wish-direction acceleration multiplier (0..100); strafing preserves sideways momentum.
AirAcceleration=10
; Initial upward speed, GoldSrc units/s (1..800). Default jump rises about 67.5 Warcraft units.
JumpSpeed=268.328
; Downward acceleration, GoldSrc units/s squared (100..3000).
Gravity=800
; Largest automatic ground step, Warcraft units (0..64). Larger drops fall under gravity.
StepHeight=27

[Loadout]
; melee = USP, knife, sword and C4 (default). all = every weapon with its starting ammo.
; Applied once on map load; F6 and F8 never grant another kit.
Mode=melee
BombCount=20
; Inventory capacity, 0..1000; starting bombs are clamped to this value.
MaxBombs=100

[Buy]
; anywhere | friendly (allied buildings OR shops) | shops (shops only).
; Rechecked for B, menu purchases and quick ammo; the world keeps running while buying.
Access=anywhere
; Maximum center distance in Warcraft world units (0..3000).
Radius=600
; Optional custom shop unit rawcodes, separated by commas/spaces, e.g. nmer,ngme.
; Friendly or neutral-passive units with shop purchase/sell/neutral-interaction abilities qualify.
ShopTypes=
; F7 always refills carried weapons for free; F9 freely grants all weapons and ammunition.

[Sky]
; Warcraft's stock sky is enabled by default in FPS on maps without a sky. F6 restores the original state.
WarcraftEnabled=true
; Private CS 1.6 sky caches are generated from your cstrike/gfx/env; no game art is shipped.
Enabled=false
; Fallback for unknown tilesets; missing private sky files leave Warcraft's sky intact.
Default=Des
; Warcraft map tileset codes -> CS filename stem. Change any mapping and press F8.
L=Des
F=Des
W=snow
B=Des
A=forest
C=snow
N=snow
I=snow
D=DrkG
G=Des
V=Des
Q=Des
J=forest
X=Des
Y=Des
Z=forest
O=DrkG

[Interface]
; Native world labels must be in front of the FPS camera and within this distance.
; Warcraft units, 0..5000; 0 hides world labels in FPS. RTS and screen-space text stay unchanged.
FloatingTextDistance=1200

[Runes]
AmmoPercent=20
; all or current. Knife/sword have no ammunition.
AmmoWeapons=all
; Warcraft world units, maximum 400. E picks one nearest ground item if the unit has an inventory.
PickupRadius=160

[Damage]
; weapon = fixed values below. hero = current average Warcraft unit attack * HeroMultiplier.
; Works for heroes AND creeps; includes their current attack bonuses. Native armor still applies.
Mode=weapon
; 0..100 percent of normal damage against owned/allied units and buildings, including C4's planter.
; 0 disables friendly damage; 100 means full damage. Applies in both weapon and hero modes.
FriendlyFirePercent=50
; Only weapon mode: enemies die from one AWP hit. Allies use FriendlyFirePercent of base damage.
AWPOneShot=true

