; Save changes and press F8 in FPS to reload this file. Restarting also loads it.
; Percentages are from each weapon's maximum magazine and reserve capacities.
; Fractional bullets accumulate across pickups (five 20% runes = one C4).
[Runes]
AmmoPercent=20
; all or current. Knife/sword have no ammunition.
AmmoWeapons=all
; Warcraft world units, maximum 400. E picks one nearest ground item if the unit has an inventory.
PickupRadius=160

[Damage]
; weapon = fixed values below. hero = current average Warcraft unit attack * HeroMultiplier.
; Works for heroes AND creeps; includes their current attack bonuses. Native armor still applies.
Mode=weapon
; 0..100 percent of normal damage against owned/allied units and buildings, including C4's planter.
; 0 disables friendly damage; 100 means full damage. Applies in both weapon and hero modes.
FriendlyFirePercent=50
; Only weapon mode: enemies die from one AWP hit. Allies use FriendlyFirePercent of base damage.
AWPOneShot=true

[AK47]
Damage=36
HeroMultiplier=1
[M4A1]
Damage=33
HeroMultiplier=1
[USP]
Damage=34
HeroMultiplier=1
[AWP]
Damage=115
HeroMultiplier=3
[Knife]
Damage=40
SecondaryDamage=65
HeroMultiplier=1
; In hero mode, secondary knife = primary * 1.625; sword = primary * 2.
[Sword]
Damage=120
SecondaryDamage=240
HeroMultiplier=3
; C4 remains a fixed explosion independent of attack. Existing 2500 damage is retained.
[C4]
Damage=2500

; H recruits owned mobile units to follow/fight; O recruits/switches them to follow without attacks.
; J releases the squad in FPS; F6/F10 also release. Buildings and foreign owners are excluded.
[Squad]
RecruitRadius=600
MaxUnits=24
FollowDistance=180
CombatLeash=900
